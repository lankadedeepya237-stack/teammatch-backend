services:
  - type: web
    name: teammatch-backend
    runtime: java
    region: oregon          # change to: frankfurt | singapore | ohio as needed
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/teammatch-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teammatch-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: teammatch-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: teammatch-db
          property: password
      - key: PORT
        value: "8080"
      - key: JAVA_OPTS
        value: "-Xmx400m -Xss512k -XX:MaxMetaspaceSize=128m"

databases:
  - name: teammatch-db
    databaseName: teammatch
    region: oregon          # must match the service region above
    plan: free
